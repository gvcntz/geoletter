# GeoLetter: geoletter.157-151-149-35.sslip.io -> 127.0.0.1:3520
# 1) sudo cp deploy/nginx-geoletter.conf /etc/nginx/sites-available/geoletter
# 2) sudo ln -s /etc/nginx/sites-available/geoletter /etc/nginx/sites-enabled/geoletter
# 3) sudo nginx -t && sudo systemctl reload nginx
# 4) sudo certbot --nginx -d geoletter.157-151-149-35.sslip.io   (adds the 443 block)
server {
    listen 80;
    listen [::]:80;
    server_name geoletter.157-151-149-35.sslip.io;

    client_max_body_size 32k;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3520;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Translation and drafting wait for Gemma on CPU.
        proxy_read_timeout 300s;
    }
}
