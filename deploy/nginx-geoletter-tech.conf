# GeoLetter on geoletter.tech -> 127.0.0.1:3520 (certificate added by certbot)
server {
    server_name geoletter.tech www.geoletter.tech;

    client_max_body_size 32k;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3520;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/geoletter.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/geoletter.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.geoletter.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = geoletter.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name geoletter.tech www.geoletter.tech;
    return 404; # managed by Certbot




}